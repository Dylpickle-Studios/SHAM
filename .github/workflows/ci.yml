name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-fund --no-audit
          else
            echo "::warning::package-lock.json is missing; using npm install. Run the Prepare lockfile workflow and commit it before a stable tag."
            npm install --no-fund --no-audit
          fi

      - name: Release-readiness checks (syntax, lint, typecheck, tests, release hygiene)
        run: npm run release:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Read package version
        id: package
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build local image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: sham:ci
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64
          build-args: |
            VERSION=${{ steps.package.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Start container
        run: |
          docker run -d --name sham-ci -p 127.0.0.1:18080:8080 \
            -e SHAM_JWT_SECRET=ci-only-secret-with-at-least-32-characters \
            sham:ci

      - name: Wait for health endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in {1..30}; do
            if [[ "$(docker inspect --format '{{.State.Running}}' sham-ci)" != "true" ]]; then
              echo "::error::Container exited during startup"
              docker inspect sham-ci || true
              docker logs sham-ci || true
              exit 1
            fi

            if curl --fail --show-error --silent http://127.0.0.1:18080/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::Health endpoint did not become ready"
          docker inspect sham-ci || true
          docker logs sham-ci || true
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm -f sham-ci || true

  integration:
    name: Deployment and Compose integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # Upgrade coverage archives the immediately preceding pre-agent
          # source revision and boots it against isolated state.
          # The upgrade drill runs an actual stable release tag, not HEAD^.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Run real deployment lifecycle and Compose tests
        env:
          SHAM_REQUIRE_UPGRADE_BASELINE: '1'
        run: npm run test:integration

      - name: Collect Docker diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker network ls || true
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' || true

  playwright:
    name: Chromium critical workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run critical browser workflows
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
