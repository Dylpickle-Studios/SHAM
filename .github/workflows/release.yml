name: GitHub release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Require committed lockfile
        run: test -f package-lock.json || { echo 'package-lock.json is required for a tagged release. Run the Prepare lockfile workflow, review its pull request, and merge it first.' >&2; exit 1; }

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Validate release
        run: |
          npm run release:check
          npm audit --omit=dev --audit-level=high

      - name: Build release archives
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          release_dir="SHAM-${version}"
          mkdir -p dist "$release_dir"
          rsync -a \
            --exclude '.git/' \
            --exclude 'dist/' \
            --exclude "$release_dir/" \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'sham-data/' \
            ./ "$release_dir/"
          mkdir -p "$release_dir/data/sites" "$release_dir/data/plugins"
          touch "$release_dir/data/sites/.gitkeep" "$release_dir/data/plugins/.gitkeep"
          zip -qr "dist/SHAM-${version}.zip" "$release_dir"
          tar -czf "dist/SHAM-${version}.tar.gz" "$release_dir"
          (cd dist && sha256sum "SHAM-${version}.zip" > "SHAM-${version}.zip.sha256")
          (cd dist && sha256sum "SHAM-${version}.tar.gz" > "SHAM-${version}.tar.gz.sha256")
          rm -rf "$release_dir"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE' > "$RUNNER_TEMP/sham-release-notes.md"
          const fs = require('node:fs');
          const version = require('./package.json').version;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const section = changelog.split(/^## /m).find((entry) => entry.startsWith(`[${version}] — `));
          if (!section) throw new Error(`Missing changelog entry for ${version}`);
          const notes = section.slice(section.indexOf('\n') + 1).trim();
          if (!notes) throw new Error(`Empty changelog entry for ${version}`);
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/blob/${process.env.GITHUB_REF_NAME}/`;
          console.log(notes.replace(/\]\((docs\/[^)]+)\)/g, (_, target) => `](${base}${target})`));
          NODE
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "SHAM ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/sham-release-notes.md" \
            --verify-tag
